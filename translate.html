<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale*1.0">
        <title> CoB Translation Tool </title>
    </head>
    <body>
      
        <h2>Translation Tool</h2>

        <!--User message to be translated -->
        <textarea id="input-message" placeholder="Enter your message here5..."></textarea>

        <!-- Language Selection & Button -->
         <div>
            <select id="language-select">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="pt">Portuguese</option>
                <option value="vi">Vietnamese</option>
                <option value="zh">Mandarin</option>
                <option value="ar">Arabic</option>
                <option value="ht">Haitian Creole</option>
            </select>   
            <button onclick="translateMessage()">Translate</button>
         </div>
         <!--Output-->
         <textarea id="translated-message" placeholder="Translated Message will appear here..." readonly></textarea>

         <!--Copy Button-->
         <button id="copy-button" onclick="copyToClipboard()" style="display:none;">Copy</button>
         
         <script>
                function translateMessage() {
                    const inputText = document.getElementById('input-message').value;
                    const targetLang = document.getElementById('language-select').value;
                    const outputBox = document.getElementById('translated-message');
                    const copyButton = document.getElementById('copy-button');

                    if (!inputText) {
                        alert('Please enter a messsage to translate');
                        return;
                    }
                
                const apiUrl = 'https://translation.googleapis.com/language/translate/v2?key=AIzaSyB0tuoIF-I1xLh3r5Q1vBdD59D0BsSj41c';

                fetch(apiUrl, 
                {
                    method: "POST",
                    headers: { "Content-Type":"application/json"},
                    body: JSON.stringify({ q: inputText, target: targetLang})
                })
                .then(response => response.json())
                .then(data => {
                    if (data && data.translations) {
                        outputBox.value = data.translations[0].translatedText;
                        copyButton.style.display = 'inline'; // shows the Copy Button after translattion
                    } else {
                      outputBox.value = 'Error. this is from the if statement';
                    }    
                })
                .catch(error => {
                    console.error('Translation error:', error);
                    outputBox.value = 'this is from the catch ERROR';
                });
            }
            //Copy to clipboard function
                function copyToClipboard(){
                const outputBox = document.getElementById('translated-message');
                outputBox.select(); //Select the translated text
                document.execCommand('copy'); //Copy the selected text to clipboard
            }
         </script>

    </body>
</html>
